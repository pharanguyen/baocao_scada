<!DOCTYPE html>
<html lang="en">
<head>

    <title>Sản Lượng Nhà Máy Nước An Dương</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/assets/js/chart-setup.js"></script>
</head>
<body>
    <h1>Sản Lượng Nhà Máy Nước An Dương</h1>
    <div>
        <label for="type">Chọn loại:</label>
        <select id="type">
            <option value="tuyen">Tuyến</option>
            <option value="chinhanh">Chi Nhánh</option>
        </select>
    </div>
    <div>
        <label for="options">Chọn:</label>
        <select id="options" multiple>
            <!-- Options sẽ được thêm vào bằng JavaScript -->
        </select>
    </div>
    <canvas id="myChart" width="800" height="400"></canvas>
